        body: |-
          I’m a Full-Stack Developer at Clear Links Technologies, where I maintain web applications across several areas, from student support and a job board platform to finance systems. That work has shown me how much effort goes into a site that simply does its job, and how much more effort goes into making it pretty. 

          I made Forge for people like me: anyone who wants to build a website, or learn how one is put together, and end up with something that doesn’t just work but is a pleasure to look at too.
